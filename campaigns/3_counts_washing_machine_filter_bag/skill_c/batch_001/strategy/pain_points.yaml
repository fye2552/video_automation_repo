sku_id: 3_counts_washing_machine_filter_bag
audience: US household laundry users with top-loading washing machines
primary_pain:
  problem: Loose hair and lint can remain on freshly washed clothing or inside the washer.
  visible_moment: A creator repeatedly picks small loose fibers from a clean pale shirt beside a top-loading washer.
  emotional_tone: Mild laundry-day frustration, realistic and non-dramatic.
product_solution:
  mechanism: The single floating filter stays near the water surface while its long fine mesh bag hangs into the wash water.
  proof: A small, realistic amount of loose lint is visible in the mesh after the wash.
claim_boundaries:
  - Do not claim perfect filtering, complete water cleaning, or removal of all debris.
  - Do not show oversized debris, magical suction, or multiple filter units.
