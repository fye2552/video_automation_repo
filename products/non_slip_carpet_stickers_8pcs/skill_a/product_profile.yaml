sku_id: "non_slip_carpet_stickers_8pcs"
product_name: "Non-Slip Carpet Stickers, 8pcs Set"
category: "rug anti-slip corner grippers"
source_info:
  title: "Non-Slip Carpet Stickers, 8pcs/Set Anti-Skid Area Rug Stickers to Prevent Rugs from Sliding or Curling, Suitable for Living Room, Dining Room & Bathroom Rugs, Stick to Floor"
  description: "Set of eight peel-and-stick rug corner grippers designed for area rugs. The stickers are applied beneath rug corners to help reduce sliding and curling on hardwood, tile, carpeted and similar indoor floor surfaces."
visual_identity:
  main_color: "matte black"
  secondary_color: "thin dark gray edge"
  material: "ultra-thin flexible adhesive-backed polymer sheet"
  shape: "a completely flat two-dimensional right-angle L-shaped corner sticker with one long vertical arm, one long horizontal arm, clipped outer tips and a rounded inner elbow"
  texture: "smooth matte black face with a nearly flush paper-thin edge"
  logo_position: "no visible logo on the finished sticker; source images show temporary blue liner print that must not appear in generated reference images"
  size_ratio: "each sticker is a thin flat L shape with two arms of approximately equal length; source size chart shows about 12 cm by 12 cm"
key_visual_features:
  - "One retail set contains exactly eight separate matching black L-shaped corner stickers"
  - "Each sticker lies completely flat as a two-dimensional sheet; it has one vertical arm and one horizontal arm forming a clean 90-degree corner profile"
  - "Outer arm tips are clipped into short angled corners rather than rounded circles"
  - "The finished visible face is plain matte black with no lettering, no blue pattern and no white backing paper"
  - "Paper-thin flexible profile designed to lie fully flat underneath an area-rug corner, never upright or self-supporting"
selling_points:
  - "Eight-piece set provides corner coverage for area rugs"
  - "L-shaped pads are designed to help keep rug corners flatter and reduce shifting"
  - "Thin profile stays concealed beneath the rug during normal use"
  - "Suitable for indoor rugs placed on common surfaces including hardwood and tile"
usage_scenes:
  - "A beige woven area rug lies flat on a light oak floor with four black L-shaped grippers concealed beneath its four underside corners"
  - "A single rug corner is gently lifted to show one thin black L-shaped sticker adhered to the underside, then the rug corner rests flat against a clean hard floor"
must_keep:
  - "保持单套产品恰好8片独立黑色L形地毯防滑贴，不要生成4片、6片、12片或其他数量"
  - "保持每片为薄型直角L形结构：一条竖向臂、一条横向臂、两个短斜切外端和圆润内侧转角"
  - "保持成品正面为纯哑光黑色，不要出现蓝色文字、白色离型纸、透明保护膜或可读标识"
  - "保持贴片超薄、平整、柔性、无按钮、无扣件、无金属件的结构"
  - "所有产品图中贴片必须完全平铺在水平表面或地毯背面，绝不能竖起、折成直角、弯成支架或自立"
  - "使用时只能贴在地毯或地垫背面四角，不要贴在地毯正面"
  - "不要增加原始产品不存在的包装、吸盘、夹子、螺丝、磁铁或额外挂钩"
must_avoid:
  - "不要改变为整张防滑网、圆形贴片、双面胶卷、地毯胶带或硅胶垫"
  - "不要把L形贴片生成成方形、三角形、U形、十字形或弯曲形"
  - "不要生成竖立的L形支架、硬质塑料角码、折弯结构、层叠厚片、立体托架或悬空贴片"
  - "不要复制原图中的文字、尺寸线、箭头、蓝色重复印花、安装步骤版式或前后对比拼图"
  - "不要虚构防水、永久粘合、绝对防滑或避免跌倒等未经证实的效果"
  - "不要让贴片从地毯边缘正面露出，也不要生成翘起的地毯边缘"
