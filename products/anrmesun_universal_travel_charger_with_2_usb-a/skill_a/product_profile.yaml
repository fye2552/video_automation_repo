sku_id: "anrmesun_universal_travel_charger_with_2_USB-A"
product_name: "ANRMESUN Universal Travel Charger with 2 USB-A and 2 USB-C Ports"
category: "universal travel power adapter and USB charger"
source_info:
  title: "ANRMESUN Universal Travel Charger with 2 USB-A & 2 USB-C Fast Charging Ports, All-in-One Portable Power Adapter European Global Universal Travel Adapter"
  description: >-
    Compact all-in-one travel adapter with two USB-A ports, two USB-C ports,
    a universal AC socket, and retractable regional plug selectors. Source copy
    claims simultaneous charging, USB-C fast charging, broad device compatibility,
    a fire-resistant shell, and intelligent electrical protection. Product posters
    additionally claim up to 65W USB-C output, 15W USB-A output, and 2400W maximum
    AC power; these remain source claims rather than independently verified facts.
visual_identity:
  main_color: "white"
  secondary_color: "coral-orange slider controls and orange port interiors, with light gray markings"
  material: "smooth molded PC-style plastic shell; source claims fire-resistant PC material"
  shape: "compact upright rectangular block with rounded and beveled edges"
  texture: "smooth matte-to-satin plastic with recessed socket and port openings"
  logo_position: "gray ANRMESUN wordmark centered on the sloped front face below the universal socket"
  size_ratio: "compact palm-sized block; one parameter poster claims 74 x 50.5 x 53.9 mm, while another image shows conflicting approximate dimensions"
key_visual_features:
  - "Universal multi-standard AC receptacle on the top/front face with orange internal safety shutters"
  - "Four charging ports on the lower front face: two rectangular USB-A ports and two smaller oval USB-C ports"
  - "Outlined 65 GaN W marking below the four USB ports"
  - "Three coral-orange plug selector sliders on the side, marked for US/AUS, UK, and EU plug systems"
  - "Integrated retractable regional plug pins supported by source images"
  - "White shell with shallow panel seams and a raised border around the USB port face"
selling_points:
  - "Two USB-A and two USB-C ports for charging up to four USB-powered devices; source claim"
  - "USB-C output up to 65W maximum and USB-A output up to 15W maximum; source poster claims"
  - "Universal AC socket and integrated EU, UK, US, and AUS plug configurations"
  - "Compact all-in-one form intended to reduce the number of separate travel adapters"
  - "Compatible with phones, tablets, watches, power banks, earphones, cameras, and other USB-powered devices; source claim"
  - "Over-current, over-voltage, over-heat, and short-circuit protection; source description claim"
usage_scenes:
  - "Charging several USB devices from one wall outlet at home or in an office"
  - "Hotel and international travel use with the appropriate integrated regional plug selected"
  - "Charging a phone, tablet, smart watch, earphones, power bank, or camera from the four USB ports"
  - "Using the universal AC receptacle as a plug-shape adapter only when the connected device supports the local voltage"
must_keep:
  - "保持产品白色主体与珊瑚橙滑块、接口内衬的颜色关系不变"
  - "保持紧凑立式方块造型、圆角和斜面比例不变"
  - "保持顶部通用插座、前部2个USB-A与2个USB-C接口的数量和位置不变"
  - "保持侧面三个插头选择滑块及US/AUS、UK、EU对应结构不变"
  - "保持ANRMESUN Logo位于前部斜面中央"
  - "保持前部65 GaN W标记、面板边框和外壳接缝"
  - "不要增加原始产品不存在的配件"
must_avoid:
  - "不要把产品变成插线板、普通墙充、电压转换器或其他品类"
  - "不要虚构电压转换功能；该产品只能按来源确认其为插头形状转换和充电适配器"
  - "不要增加或减少USB接口、插孔、滑块、插脚、按钮、灯光、屏幕或装饰"
  - "不要改变产品颜色、Logo、标签位置、结构、纹理和视觉比例"
  - "不要把65W、2400W、安全保护或认证表现为未经验证的绝对保证"
  - "不要复制平台水印、尺寸线、国家地标拼图、营销标题或卖点图标"
