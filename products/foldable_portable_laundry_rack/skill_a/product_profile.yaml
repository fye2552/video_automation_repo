sku_id: "foldable_portable_laundry_rack"
product_name: "Foldable Portable Multi-Level Laundry Drying Rack"
category: "Laundry Organization / Foldable Drying Rack"
source_info:
  title: "Foldable Portable Laundry Rack for Air Drying Clothing Indoor Outdoor Use White Chrome Heavy Duty Compact Easy to Move Efficient Air Drying Home Use#Summervibes"
  description: "White foldable portable laundry rack with an accordion-style scissor frame, multiple horizontal drying rails, a compact folding form, and a free-standing indoor household design. Source size graphic states an expanded height of approximately 41.8 inches, width 29.5 inches, and depth 14.5 inches."
visual_identity:
  main_color: "Solid matte white"
  secondary_color: "No secondary color; small white hinge caps match the frame"
  material: "White epoxy-coated tubular steel with white plastic hinge joints"
  shape: "Free-standing wide rectangular accordion-style drying rack with two folding scissor side frames, a flat top rail platform, and multiple long horizontal drying rails"
  texture: "Smooth white painted tubular metal with small rounded white plastic pivot caps"
  logo_position: "No visible logo or readable brand text"
  size_ratio: "Wide horizontal frame approximately 29.5 inches wide, 41.8 inches high, and 14.5 inches deep when expanded"
key_visual_features:
  - "One single white free-standing folding laundry rack, never wall-mounted or ceiling-mounted"
  - "Two matching white accordion scissor side frames, one at each end, with repeated X-shaped diagonal support bars"
  - "One flat top rectangular platform made from several closely spaced parallel white rods"
  - "Multiple long straight horizontal white drying rails stacked below the top platform"
  - "Four slender white floor legs splayed slightly outward, with no wheels and no black feet"
  - "Small round white pivot caps at the scissor-frame joints and rail connections"
selling_points:
  - "Accordion-style folding frame for compact storage"
  - "Multiple horizontal rails create separated hanging space for laundry and towels"
  - "Free-standing white tubular steel structure for indoor household drying"
  - "Top platform provides additional horizontal drying rails"
usage_scenes:
  - "Expanded and standing on a clean laundry-room floor beside a front-loading washing machine"
  - "A few dark pants and light towels hang naturally over separate horizontal rails without covering the frame structure"
  - "Folded flat and leaned upright against a plain wall for storage"
must_keep:
  - "保持整体为纯白色管状金属折叠晾衣架，不要加入其他颜色"
  - "保持左右两端各一组相同的手风琴式X形剪刀支架"
  - "保持顶部由多根密集平行白色横杆组成的平整长方形晾晒平台"
  - "保持顶部下方多层长直白色横向晾杆和四根略向外张开的白色落地腿"
  - "保持所有铰接点为小型圆形白色连接帽，产品无轮子、无挂钩、无布袋"
  - "保持展开后宽大横向比例和收起后扁平折叠结构"
must_avoid:
  - "不要生成衣柜、落地衣架、单杆晾衣架、伸缩杆、壁挂杆、天花板晾衣架或电动烘干机"
  - "不要把X形剪刀支架改成A字梯、直立方框、木质架、黑色金属架或塑料架"
  - "不要生成轮子、衣夹、额外侧翼、挂钩、布艺晾晒网、加热器、电源线或控制按钮"
  - "不要省略顶部密集平行横杆、下方多层横杆、白色铰接帽和四根落地腿"
  - "不要生成尺寸箭头、承重图标、宣传文字、发霉或防锈效果、价格或水印"
  - "不要虚构承重、快速烘干、适用于任何天气或户外防水的效果"
