image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for the TANLOOK High-Power Electric Leaf Blower kit. Show the cordless blower in a three-quarter side view with a bright yellow molded body, black honeycomb side intake grille, top handle with black textured grip, rear vertical 20V MAX 4Ah battery pack, long two-piece matte black blower tube, tapered black extension nozzle, and small yellow tube-release buttons. Arrange two black TANLOOK 20V MAX 4Ah battery packs and a compact black charger with cord neatly beside the blower. Studio lighting, realistic molded plastic, crisp shadows, sharp product edges. No leaves, no snow background, no large text, no callout lines, no dimension labels."
  product_detail_collage: "Create a premium product-detail catalog image for a TANLOOK cordless leaf blower. Center the yellow-and-black blower on a light gray studio background, then add four clean close-up detail panels showing: the black honeycomb air intake grille, the top handle with black textured grip and speed/start switch area, the detachable black blower tube with yellow release button, and the 20V MAX 4Ah TANLOOK battery pack plus charger. Keep the layout tidy and high-end with realistic plastic texture and controlled spacing. Minimal readable product branding only; avoid poster headlines, numbered callouts, dotted guide lines, and exploded instruction graphics."
  realistic_usage_scene: "Create a realistic autumn yard cleanup scene featuring the TANLOOK cordless electric leaf blower. A person holds the yellow-and-black handheld blower by the top grip, with the black two-piece tube pointed toward a pile of dry orange and brown leaves on a suburban driveway or lawn edge. Show leaves being pushed forward by strong airflow, with the TANLOOK side badge and rear battery pack visible. Natural outdoor daylight, practical garden-tool realism, correct handheld scale, no power cord. No giant text, no floating icons, no dimension labels, no exaggerated storm effects."
