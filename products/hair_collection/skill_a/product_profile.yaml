material_behavior:
  white_plastic_frame:
    rigidity: "Rigid and dimensionally stable"
    movement: "May drift gently with the water but must not bend, stretch, split, or deform"
  blue_float_domes:
    rigidity: "Rigid glossy hemispherical plastic components"
    movement: "Remain permanently attached to the white support structure"
  mesh_bag:
    flexibility: "Soft flexible fine mesh"
    movement: "May move gently with the water while remaining attached and retaining one tapered cone shape"

direct_core_use:
  action: "The complete filter floats steadily near the water surface while the tapered mesh bag remains submerged in the wash water"
  product_state: "Fully assembled before the scene begins and unchanged throughout the scene"
  compatible_appliance: "Top-loading washing machine with visible wash water"
  movement_level: "Gentle water movement only"
  required_visibility:
    - "The white circular frame remains visible"
    - "All four blue float domes remain visible whenever practical"
    - "The connection between the frame and mesh bag remains identifiable"
    - "The product is not completely covered by laundry"

selling_points:
  - "Designed to float near the water surface during a top-loading washing cycle"
  - "Fine mesh is intended to collect floating hair, lint, paper fragments, cotton fibers, and other small debris"
  - "Reusable construction"
  - "Designed to help reduce loose debris returning to washed clothing"
  - "Designed to help reduce loose residue remaining inside the washing machine"
  - "Long tapered mesh bag provides space for collecting small floating debris"

usage_scenes:
  - "One complete filter floating steadily near the water surface inside a top-loading washing machine"
  - "The white circular frame and blue float domes remain above or near the water surface"
  - "The long tapered mesh bag remains submerged beneath the floating frame"
  - "Laundry moves gently around the product without completely covering it"
  - "The filter drifts slowly with mild natural water ripples"
  - "Only a small restrained amount of lint or fibers may appear inside the mesh bag"

