  main_color: "White"
  secondary_color: "Sky blue"
  material: "Smooth white plastic outer ring and support spokes, glossy sky-blue hemispherical float domes, and one white ultra-fine mesh bag"
  shape: "One fully assembled round floating filter with one white circular outer ring, exactly four attached blue hemispherical float domes, exactly three white support spokes, and one long tapered cone-shaped mesh bag"
  texture: "Smooth glossy white plastic, glossy sky-blue float domes, and fine translucent white woven mesh"
  logo_position: "No visible logo"
  size_ratio: "One single unit is approximately 9.5 cm in diameter and 13.5 cm in overall height"

