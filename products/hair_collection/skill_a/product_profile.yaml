  - "The model may remove, merge, split, or duplicate white support spokes"
  - "The model may move blue float domes outside the white circular outer ring"
  - "The model may change the one-center-plus-three-outer arrangement"
  - "The model may shorten, widen, split, duplicate, or remove the tapered mesh bag"
  - "The model may separate the mesh bag from the floating frame"
  - "Laundry may cover the frame and cause the model to reconstruct the product incorrectly"
  - "Strong water movement may cause component duplication or structural transformation"
  - "Scene changes may cause the product to be regenerated with a different component count"

generation_risk_level: "high_risk_geometry"

generation_strategy:
  preferred_mode: "one fixed usage target per independent video generation"
  preferred_workflow:
