  - "Showing the product as separate unassembled components"
  - "Strong washer agitation"
  - "Rapid spinning"
  - "Product flipping"
  - "Product sinking completely below the water"
  - "Blue float domes detaching from the frame"

recommended_video_camera:
  view: "Stable upper three-quarter view into an open top-loading washing machine"
  framing: "Keep the complete circular floating frame visible and preserve visibility of the mesh attachment"
  movement: "Fixed camera with no zoom, orbit, whip-pan, or dramatic motion"
  water_motion: "Only gentle natural ripples and slow laundry movement"
  transition: "Use direct editorial cuts only"
  avoid:
    - "Extreme close-up that crops the circular frame"
    - "Strong top-down compression that hides the mesh connection"
    - "Low angle that hides the number and arrangement of the blue float domes"
    - "Laundry completely covering the product"
    - "Heavy foam or opaque water hiding the structure"

geometry_lock_en: "One single fully assembled floating laundry lint filter with exactly four glossy sky-blue hemispherical float domes in total: one fixed at the exact center and exactly three permanently attached around it at equal 120-degree intervals. One white circular outer ring surrounds all four floats, exactly three white support spokes connect the center structure to the ring, and one long tapered white mesh bag remains permanently attached beneath the frame. No float may detach, duplicate, disappear, or appear outside the ring."

short_scene_geometry_lock_en: "Same exact filter, unchanged: exactly four attached blue floats, one center plus three outer, one white ring, three spokes, and one tapered mesh bag."

