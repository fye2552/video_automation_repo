sku_id: "3_counts_washing_machine_filter_bag"
product_name: "3 Counts Washing Machine Filter Bag, Reusable Floating Hair Filter for Laundry"
category: "Reusable floating washing machine lint and hair filter bag"

source_info:
  title: "3 Counts Washing Machine Filter Bag, Reusable Floating Hair Filter for Laundry"
  description: |
    A reusable floating laundry filter designed to remain near the water
    surface during a top-loading washing cycle.

    The product uses one round floating plastic frame and one long tapered
    ultra-fine mesh bag to collect loose floating hair, lint, paper fragments,
    cotton fibers, and other small debris.

    The marketplace product is sold as a 3-count set. All generated reference
    images and videos must show only one complete filter unit unless the user
    explicitly requests the full retail set.

