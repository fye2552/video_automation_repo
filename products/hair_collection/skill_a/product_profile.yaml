    - "Generate additional laundry-load versions as separate independent video tasks"
    - "Select stable segments from each independently generated video"
    - "Combine the selected segments during editing"
  fallback_mode: "one continuous 10-second scene with one laundry load"
  prohibited_mode:
    - "Do not transform one laundry load into another inside a continuous generated shot"
    - "Do not use morphing transitions between laundry loads"
    - "Do not allow the product to leave the frame and re-enter"
    - "Do not use strong agitation to create visual variety"

