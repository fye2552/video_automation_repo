  - "The three outer blue float domes are evenly spaced at 120-degree intervals"
  - "All four blue float domes remain inside the white circular outer ring"
  - "Exactly three white support spokes"
  - "Each white support spoke connects the center structure to the white circular outer ring"
  - "One long tapered cone-shaped white ultra-fine mesh collection bag"
  - "The mesh bag is permanently attached beneath the circular floating frame"
  - "The complete product remains one physically connected unit"

