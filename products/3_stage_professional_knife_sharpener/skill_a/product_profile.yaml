sku_id: "3_stage_professional_knife_sharpener"
product_name: "3-Stage Professional Knife Sharpener"
category: "Kitchen Tools / Manual Knife Sharpener"
source_info:
  title: "3-stage Professional Sharpening Tool | High Precision Sharpening Stone, Diamond and Ceramic Sharpening Stone with Anti Slip Handle | Easy To Use, Fast Sharpening, Long-lasting Performance | Suitable for Father's Day|"
  description: "Manual three-stage knife sharpener with a red-and-black anti-slip handle, three sharpening slots, a removable slot module, compact countertop form, and a red anti-slip base edge. Source images show use with straight-edged kitchen knives; serrated knives, wavy knives, and scissors are excluded in the visual instructions."
visual_identity:
  main_color: "Matte black"
  secondary_color: "Bright red grip inlay and red anti-slip base edge; polished silver slot covers"
  material: "Black ABS-style plastic body, red rubberized grip and base trim, polished metal slot covers"
  shape: "Low horizontal countertop sharpener with a rectangular black sharpening base on the left and one long curved arch handle extending to the right"
  texture: "Matte molded plastic body with smooth red rubberized panels and reflective polished silver channel covers"
  logo_position: "No visible logo or readable brand text"
  size_ratio: "Approximate full product size 19.3 cm long, 6.3 cm wide, 5.2 cm high; long horizontal silhouette"
key_visual_features:
  - "One single black-and-red manual sharpener, never a separate sharpener body and separate handle"
  - "Black rectangular left sharpening base with two upright black end walls"
  - "Exactly three parallel polished silver arch-shaped slot covers across the top of the sharpening base"
  - "Each silver cover contains one deep black vertical U-shaped knife slot"
  - "One long curved black handle extending from the right side, with a large bright-red upper grip inlay and a black underside"
  - "Continuous thin bright-red anti-slip trim around the bottom perimeter"
  - "Removable three-slot sharpening module seated in the black base"
selling_points:
  - "Three distinct sharpening slots for staged knife maintenance"
  - "Red-and-black anti-slip ergonomic handle"
  - "Compact manual countertop form with a red anti-slip base edge"
  - "Removable three-slot sharpening module"
usage_scenes:
  - "Placed flat on a clean kitchen countertop while one adult hand holds the red-and-black handle and the other hand guides a straight-edged kitchen knife through one slot"
  - "Stored upright or flat in a kitchen drawer after use"
must_keep:
  - "保持黑色底座、红色握把嵌条和红色底部防滑边的颜色分布不变"
  - "保持左侧磨刀底座和右侧长弧形手柄的一体式横向轮廓不变"
  - "顶部必须恰好三个并列银色弧形磨刀槽罩，每个槽罩内有黑色U形开口"
  - "保持低矮横向比例、两端黑色立壁和底部红色防滑边不变"
  - "保持可拆卸三槽模块位于黑色底座内，不要改变模块数量"
  - "不要增加原始产品不存在的配件、按钮、灯光、屏幕、充电接口或品牌标识"
must_avoid:
  - "不要改变产品品类，不要生成电动磨刀机、磨刀石、圆形磨刀器或五槽磨刀器"
  - "不要把三个银色槽罩变成四个或两个，不要省略黑色U形开口"
  - "不要把右侧红黑弧形手柄变成直柄、木柄、全红柄或独立配件"
  - "不要生成锯齿刀、波浪刀、剪刀、前后对比图、蓝色发光特效、箭头、文字和标签"
  - "不要虚构防锈、绝对锋利、瞬间磨利、安全保护或适用于所有刀具的功效"
  - "不要改变包装、结构、纹理和视觉比例"
