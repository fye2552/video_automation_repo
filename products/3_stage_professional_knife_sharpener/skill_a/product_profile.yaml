  main_color: "black and red"
  secondary_color: "silver/metallic (sharpening slots)"
  material: "ABS plastic handle, stainless steel, tungsten steel, and ceramic"
  shape: "ergonomic curved handle with a sturdy rectangular base and a raised sharpening block with 3 U-shaped slots"
  texture: "smooth plastic handle with anti-skid grip, metal sharpening head"
  logo_position: "none visible on the product itself"
  size_ratio: "total length 19.3cm, height 6.3cm"
key_visual_features:
  - "3 distinct U-shaped sharpening slots on a metallic block"
  - "Red and black ergonomic curved handle"
  - "Removable/detachable sharpening head block for easy cleaning"
  - "Anti-skid base"
selling_points:
  - "Suitable for most types of straight-edge knives including chef, boning, fruit, and chopping knives"
  - "Detachable head allows for easy disassembly and washing"
  - "Restores double-beveled edges quickly"
usage_scenes:
  - "Held firmly on a kitchen counter while a user pulls a chef's knife backward through one of the sharpening slots"
  - "Held firmly on a kitchen counter while a user pulls a heavy cleaver through the slot"
