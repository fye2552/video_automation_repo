source_info:
  title: "3 in 1 Knife Sharpener"
  description: "A 3-in-1 manual knife sharpener featuring a red and black ergonomic ABS plastic handle, an anti-skid base, and a removable sharpening head. The sharpening block includes three V-shaped slots utilizing tungsten steel and ceramic fine grinding materials."
