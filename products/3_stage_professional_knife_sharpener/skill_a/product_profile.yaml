  source_confidence: "confirmed"
  source: "usage instruction poster"
  intended_user: "adult home cook"
  prerequisites:
    - "Place the sharpener on a flat surface and hold the handle firmly"
  compatible_items:
    - "Straight-edge kitchen knives, chef knives, cleavers"
  steps:
    - step: 1
      action: "Insert the knife blade into the sharpening slot"
      object_or_contact_point: "The metal sharpening slots"
      orientation_or_position: "Vertical, resting in the V-groove"
      motion: "Pull the knife backward towards the user"
      repetitions: "multiple passes"
  safety_constraints:
    - "Do not push the knife forward or use a back-and-forth sawing motion"
  prohibited_actions:
    - "Do not use on serrated knives, wavy knives, or scissors"
