image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for an aluminum grass trimmer auxiliary handle accessory. Show the complete handle kit: a polished silver U-shaped bent aluminum handle tube, one black soft ergonomic rubber grip with flared ends, a gray cast-metal bracket clamp at the lower end with six visible silver bolts and two round clamp openings, a small Allen key, and two black rubber spacer rings marked visually as different sizes. The product should look like a power-tool accessory, not a complete trimmer. Studio lighting, sharp metal reflections, realistic cast-metal texture, clean shadows, no brand logo, no text overlays, no instruction poster layout."
  product_detail_collage: "Create a premium product-detail catalog image for a grass trimmer auxiliary handle. Center the silver bent aluminum handle with black rubber grip and gray clamp bracket, then add four neat close-up detail panels showing: the soft black grip texture and flared ends, the polished aluminum alloy tube, the gray six-bolt bracket clamp with black rubber spacer inside, and the Allen key tightening one clamp bolt. Use a white or light gray studio background, precise spacing, realistic materials, and minimal or no text. Avoid large headlines, arrows, dimension labels, and busy instruction graphics."
  realistic_usage_scene: "Create a realistic outdoor lawn maintenance scene showing the aluminum trimmer handle accessory installed on a straight-shaft grass trimmer. A gardener holds the black ergonomic grip of the silver U-shaped auxiliary handle while using the trimmer over green grass. The gray metal bracket clamp with six bolts should be visible around the trimmer shaft, with the handle angled upward for better control. Natural daylight, practical garden setting, realistic scale, focus on the installed accessory. Do not make the accessory look like the entire trimmer, no poster text, no floating callouts, no brand logo."
