image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for XISHUN multi-purpose kitchen grease cleaner spray. Show one white plastic trigger spray bottle with a long white nozzle, ribbed white collar, molded ergonomic side grooves, and a wide rounded lower body. The front label should be a rounded rectangle with a bright yellow-to-orange gradient, bold deep-blue GREASE CLEANER style lettering, a small red XISHUN oval badge near the top, a red horizontal stripe, small surface-use icons, and a 500 ml scale cue. Place the matching yellow rectangular retail box slightly behind the bottle at a three-quarter angle, with blue multi-purpose cleaner lettering and small kitchen surface panels. Studio lighting, realistic plastic texture, crisp label edges, subtle shadow. No poster headline, no floating icons, no before-after comparison, no extra brands."
  product_detail_collage: "Create a polished product-detail catalog image for a XISHUN kitchen degreaser spray. Center the white trigger bottle and yellow box on a light gray studio background, then add three neat close-up detail panels showing: the white trigger nozzle spraying a fine mist, the ribbed screw collar and molded side-grip bottle shape, and the yellow-orange label with blue GREASE CLEANER lettering, red XISHUN badge, red stripe, small surface icons, and 500 ml mark. Keep the composition clean and premium, with realistic reflections and sharp edges. Use only minimal readable label text; avoid large advertising headlines, before-after labels, surface-list pills, and cluttered poster graphics."
  realistic_usage_scene: "Create a realistic kitchen cleaning scene featuring the XISHUN multi-purpose grease cleaner spray. A hand holds the recognizable white trigger bottle with yellow-orange label, blue GREASE CLEANER lettering, and red XISHUN badge, spraying cleaner into a greasy stainless-steel kitchen sink or onto a greasy stovetop edge. Show visible grease residue beginning to dissolve, light mist from the nozzle, and a clean cloth nearby for wiping. Include the yellow retail box on the counter in the background if it fits naturally. Bright American home kitchen, natural daylight, practical realism, no giant text, no before-after split, no floating icons, no exaggerated chemical smoke."
