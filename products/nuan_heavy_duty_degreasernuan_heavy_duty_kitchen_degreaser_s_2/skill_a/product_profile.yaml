image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for NUAN Heavy Duty Degreaser kitchen spray. Show one white plastic trigger spray bottle with a large white nozzle, ribbed white collar, curved ergonomic bottle body, and a bright green front label with the black NUAN logo, bold Heavy Duty Degreaser product name, small peach scent badge, orange footer, and 500 ml / 17.6 fl oz scale cue. Place the matching green retail box slightly behind the bottle at a three-quarter angle, with foam/bubble graphics and a small oven-grease image panel. Optional accessories: one folded blue microfiber cloth and a pair of white disposable gloves neatly placed to the side. Studio lighting, sharp shadows, realistic plastic and glossy label texture. No poster layout, no large headline text, no callout bubbles, no extra brands."
  product_detail_collage: "Create a premium product-detail image for NUAN Heavy Duty Degreaser spray, arranged as a clean catalog composition rather than an advertising poster. Center the white trigger spray bottle and green box, then add three small close-up detail windows showing: the angled white trigger nozzle spraying fine foam, the ribbed white collar and ergonomic bottle neck, and the green label with NUAN branding, peach scent badge, orange footer, and 500 ml / 17.6 fl oz area. Use a white or very light gray background, realistic reflections, crisp product edges, and controlled spacing. Keep any label text minimal and believable; do not include giant instructional words, step numbers, before-after captions, or messy promotional typography."
  realistic_usage_scene: "Create a realistic American home kitchen cleaning scene featuring NUAN Heavy Duty Degreaser. A hand holds the recognizable white trigger spray bottle with green NUAN Heavy Duty Degreaser label and sprays foaming cleaner onto a greasy stovetop near burner grates, with a range hood and light countertop in the background. Show dissolved grease and white foam on the surface, plus a folded blue microfiber cloth nearby ready for wiping. Product label should be visible enough to recognize the white bottle, green label, black NUAN logo, peach scent badge, and orange footer. Natural daylight, practical kitchen realism, no poster text, no before-after split, no floating icons, no exaggerated chemical smoke."
