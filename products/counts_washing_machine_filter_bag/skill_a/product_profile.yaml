sku_id: "3_counts_washing_machine_filter_bag"
product_name: "3 Counts Washing Machine Filter Bag, Reusable Floating Hair Filter for Laundry"
category: "Reusable floating washing machine lint and hair filter bag"

source_info:
  title: "3 Counts Washing Machine Filter Bag, Reusable Floating Hair Filter for Laundry"
  description: "A reusable floating filter designed to stay near the water surface during a top-loading washing cycle and collect hair, lint, paper fragments, cotton fibers, and other small floating debris with a cone-shaped ultra-fine mesh bag. The product is sold as a 3-count set, but all reference images must lock the product as a single unit only."

visual_identity:
  main_color: "White"
  secondary_color: "Sky blue"
  material: "Smooth white plastic frame and float domes with a white ultra-fine mesh bag"
  shape: "One single round floating filter head attached to a long tapered cone-shaped mesh bag"
  texture: "Smooth glossy plastic and fine translucent woven mesh"
  logo_position: "No visible logo"
  size_ratio: "One single unit is approximately 9.5 cm in diameter and 13.5 cm in overall height"

key_visual_features:
  - "Only one single filter unit appears in each image"
  - "White circular outer rim"
  - "Exactly four rounded float domes: one central dome and three outer domes"
  - "Blue float domes"
  - "White three-spoke support structure connecting the float domes to the circular rim"
  - "Long pointed cone-shaped white fine-mesh collection bag"
  - "Single-unit structure must remain consistent across all images"

selling_points:
  - "Designed to float near the water surface during a top-loading wash cycle"
  - "Fine mesh is intended to collect floating hair, lint, paper fragments, cotton fibers, and small debris"
  - "Reusable construction"
  - "Designed to reduce loose debris returning to washed clothing"
  - "Designed to help reduce loose residue left inside the washing machine"

usage_scenes:
  - "One single filter floating on the water surface inside a top-loading washing machine with laundry"
  - "The mesh cone extends downward into the wash water while the blue floating top remains above the surface"
  - "Removed after washing so collected lint and hair can be emptied from the mesh"

must_keep:
  - "保持产品为单只出镜"
  - "保持蓝色浮球配色不变"
  - "保持白色圆形外框不变"
  - "保持顶部四个球形浮漂不变：中间一个，外围三个"
  - "保持白色三向支撑结构不变"
  - "保持长锥形白色细网袋不变"
  - "保持产品材质、比例和尺寸关系不变"
  - "不要增加原始产品不存在的配件"

must_avoid:
  - "不要在同一张图中生成三只或多只产品"
  - "不要改变产品品类"
  - "不要虚构不存在的功能"
  - "不要把产品生成成洗衣球、普通洗衣袋、排水口滤网或固定式过滤器"
  - "不要增加按钮、灯光、接口、拉链、绳带、手柄或装饰"
  - "不要改变浮球数量、圆形外框、支撑结构和网袋长度"
  - "不要生成文字、箭头、尺寸线、包装或对比海报"
  - "不要生成夸张的大块垃圾、神奇吸附效果或完全净化水体的效果"

