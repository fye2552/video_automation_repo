sku_id: "multifunctional_mop_holder_with_hook"
product_name: "Multifunctional Mop Holder with Hook"
category: "wall-mounted cleaning tool organizer"
source_info:
  title: "Multifunctional Mop Holder with Hook, Broom Mop Holder with 4 Racks 5 Hooks, Heavy Duty Mop Holder, Self Adhesive Mop Holder Wall Mounted, Broom Holder Wall Mount for Kitchen, Bathroom, Closet"
  description: "Self-adhesive wall-mounted organizer with 5 non-slip silicone roller clip positions and 5 hooks. Intended to organize brooms, mops, rakes, umbrellas, tools and small cleaning accessories on smooth indoor surfaces such as tile, stainless steel and glass."
visual_identity:
  main_color: "light gray"
  secondary_color: "white"
  material: "smooth molded plastic housing with white silicone roller clips and gray plastic hooks"
  shape: "one slim horizontal wall-mounted bar with rounded capsule-shaped end caps, five gray clamp sections with visible white roller mechanisms, and five evenly spaced downward J-hooks"
  texture: "matte to satin-smooth plastic with smooth rounded edges"
  logo_position: "small black wordmark centered on the middle gray rectangular clip housing in source images"
  size_ratio: "wide and shallow horizontal bar, approximately 33.4 cm wide and 8.8 cm tall in the source size chart"
key_visual_features:
  - "Exactly five white vertical spring-loaded silicone roller clip positions, including one inside each rounded end section and three inside the central gray clamp sections"
  - "Exactly five light-gray downward-facing J-hooks, one beneath each section across the bar"
  - "Light-gray elongated rear bar with rounded capsule-shaped left and right end caps"
  - "Three central rectangular gray clamp housings sit between the two rounded end clamp sections"
  - "Designed for adhesive wall mounting on a flat smooth surface"
selling_points:
  - "Five non-slip roller clip positions grip broom and mop handles of different diameters"
  - "Five integrated hooks keep smaller cleaning accessories within reach"
  - "Wall-mounted layout clears floor space and organizes cleaning tools vertically"
  - "Self-adhesive mounting is intended for smooth surfaces such as clean tile, stainless steel and glass"
usage_scenes:
  - "Mounted horizontally on a light-gray tiled laundry-room or bathroom wall, holding five upright broom or mop handles with small accessories hanging from the J-hooks"
  - "Mounted inside a utility closet to organize mops, brooms and lightweight cleaning accessories"
must_keep:
  - "保持单个横向壁挂式清洁工具收纳架，不要拆成多个独立挂架"
  - "保持浅灰色主体、白色滚轮夹位和浅灰色挂钩的颜色分布不变"
  - "严格保持5个夹位和5个向下J形挂钩的数量不变"
  - "保持两端圆角夹位外壳、中央三个矩形夹位外壳和细长横向比例不变"
  - "保持滚轮夹位、挂钩和壁挂背板的位置关系不变"
  - "保持光滑塑料材质、厚度和圆角边缘不变"
  - "不要增加原始产品不存在的吸盘、螺丝孔、锁扣、按钮、灯光、接口或额外挂钩"
must_avoid:
  - "不要改变为金属挂杆、木质挂架、吸盘式挂架或落地收纳架"
  - "不要把5个夹位生成成4个、6个或更多夹位"
  - "不要把5个J形挂钩生成成4个、6个或更多挂钩"
  - "不要虚构承重数值、防水等级、永久不掉落或其他未经证实的效果"
  - "不要生成黑色、彩色、透明或多层拼接的主体"
  - "不要复制原图中的文字、尺寸线、箭头、营销标语、拼图排版或可读品牌文字"
