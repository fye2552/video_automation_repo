must_avoid:
  - "不要在同一张图中生成两个或多个完整产品"
  - "不要复制提手、储水槽、排气孔、排水口和底部边框"
  - "不要把侧边储水槽移动到产品顶部"
  - "不要把侧边储水槽生成成独立水杯、水壶、喷嘴或可拆卸容器"
  - "不要把储水槽生成成完全封闭且没有内部注水空间的装饰盒"
  - "不要把顶部蒸汽排气结构生成成电子按钮、显示屏或大型旋钮"
  - "不要增加第二个提手、侧把手、长柄或折叠提手"
  - "不要改变提手、储水槽、顶部排气孔和排水口之间的位置关系"
  - "不要把底部排水口生成成螺丝孔、挂孔、装饰孔或橡胶脚垫"
  - "不要删除底部导流槽和圆形排水口"
  - "不要增加独立接水盘、可拆卸托盘或额外底座"
  - "不要把产品生成成硅胶折叠罩、金属罩、保鲜盒或普通塑料碗盖"
  - "不要让罩体直接压在食物表面"
  - "不要增加文字、箭头、尺寸线、品牌水印或商品包装"
  - "不要生成夸张蒸汽、白色浓雾、冰霜、爆炸飞溅或虚假加热特效"
  - "不要让食物、餐盘和微波炉发生复制或明显变形"

