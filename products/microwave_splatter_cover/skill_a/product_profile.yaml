  - "Helps reduce food and grease splatter inside the microwave"
  - "Side water reservoir supports steam-assisted reheating"
  - "Helps retain moisture in reheated food"
  - "Integrated reinforced handle provides a stable lifting point"
  - "Wide handle helps keep the hand away from the heated food area"
  - "Approximately 10-inch diameter fits many standard dinner plates and bowls"
  - "Reusable alternative to disposable plastic wrap"
  - "Lower drainage channel collects excess condensation"
  - "Small lower outlet allows collected condensation water to be poured out"
  - "Suitable for microwave and refrigerator use according to the source listing"
  - "Source listing recommends keeping individual microwave heating sessions within four minutes"

