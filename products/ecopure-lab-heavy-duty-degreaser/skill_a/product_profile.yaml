image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for EcoPure Lab Heavy Duty Degreaser. Show one white trigger spray bottle with a short rectangular white nozzle, ribbed white collar, molded finger grooves on the side, and a curved orange front label over a dark navy bottom band. The label should show the EcoPure Lab logo near the top, bold Heavy Duty Degreaser wording, Foaming Action subtitle, a small stovetop grease image panel, and a 10.1 fl oz / 300 ml capacity cue. Place the matching orange retail box slightly behind the bottle at a three-quarter angle with the same orange and navy design. Studio lighting, realistic plastic texture, crisp label edges, subtle shadow. No poster headline, no before-after layout, no floating icons, no extra brands."
  product_detail_collage: "Create a premium product-detail catalog image for EcoPure Lab Heavy Duty Degreaser kitchen spray. Center the white 300 ml trigger bottle and orange retail box on a light gray studio background, then add four clean close-up detail panels showing: the white trigger nozzle spraying fine foam, the ribbed screw collar and molded finger-groove bottle body, the orange and dark navy label with EcoPure Lab logo and Heavy Duty Degreaser Foaming Action identity, and the foam texture lifting grease from a stainless stovetop surface. Keep the composition tidy and high-end, with realistic reflections and minimal readable text. Avoid large advertising headlines, before-after labels, bubble callouts, and cluttered poster graphics."
  realistic_usage_scene: "Create a realistic American kitchen cleaning scene featuring EcoPure Lab Heavy Duty Degreaser. A hand holds the recognizable white trigger bottle with orange label, dark navy footer, EcoPure Lab logo, and Heavy Duty Degreaser identity, spraying foaming cleaner onto a greasy stainless range hood above a stovetop. Show white foam clinging to brown cooking grease and beginning to loosen it, with a gray cleaning cloth nearby. Natural kitchen daylight, practical realism, product label visible but not oversized. No giant text, no before-after split, no floating icons, no exaggerated chemical smoke."
