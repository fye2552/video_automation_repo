sku_id: "vtopmart_clear_storage_drawers"
product_name: "Vtopmart Clear Stackable Storage Drawers"
category: "home organization / storage bins"
source_info:
  [cite_start]title: "Vtopmart 2-5 Pack Large Clear Stackable Storage Drawers 23QT, Easily Assemble Closet/Styling Tools Storage Bins, Dust-Proof UnderBed Organizer for Hot Tools, Clothing, Bedroom, Entryway, Playroom & Apartment Organization [cite: 1]"
  [cite_start]description: "Made from durable PET plastic, these clear storage bins offer a crystal-clear view of your items[cite: 2]. The design features an outer frame with a sliding inner pull-out drawer on a track[cite: 6]. They are stackable and modular, allowing for free combination to maximize vertical space in closets, under beds, or playrooms[cite: 3, 4]."
