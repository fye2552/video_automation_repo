selling_points:
  - [cite_start]"Stackable and modular design maximizes vertical space and fits any room [cite: 4]"
  - [cite_start]"Pull-out drawer allows easy access to back items without unstacking the entire bin [cite: 3]"
  - [cite_start]"Crystal-clear PET plastic ensures everything is visible at a glance, eliminating digging [cite: 2]"
  - [cite_start]"Dustproof design protects clothing, toys, and linens [cite: 3]"
  - [cite_start]"Easy 2-minute assembly by setting up the outer frame and sliding the drawer into the track [cite: 5, 6]"
usage_scenes:
