image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for a SEESE car wash foam gun garden-hose kit. Show the main foam gun in a three-quarter side view: bright lime yellow-green outer pistol handle, black inner trigger and grip, black horizontal barrel, lime ribbed front adjustment ring, black collar with white SEESE logo, and a clear cylindrical soap cup attached underneath with 30 ml, 120 ml, 180 ml, and 240 ml measurement marks and pale yellow-green liquid inside. Arrange the separate long specialized nozzle below it, with a black round spray head, silver tube, lime ribbed ring, and black connector tail. Add small black connector adapters and filter cap neatly beside the kit. Studio lighting, crisp molded plastic texture, transparent cup reflections, no car background, no poster text, no callout arrows."
  product_detail_collage: "Create a premium product-detail catalog image for the SEESE garden hose foam cannon kit. Center the lime green and black foam gun with the transparent soap cup, then add four clean close-up detail panels: the white SEESE logo on the black collar, the lime clean-mode switch on top, the clear cup measurement marks with light green soap solution, and the long silver multi-pattern nozzle with black spray head and lime adjustment ring. Include the hose connector and black adapters at the bottom as organized kit parts. Use a light gray studio background, realistic plastic and transparent material, precise spacing, and minimal readable text only on the product logo. Avoid large headlines, arrows, comparison labels, and cluttered collage styling."
  realistic_usage_scene: "Create a realistic driveway car-washing scene featuring the SEESE car wash foam gun connected to a garden hose. A hand holds the lime yellow-green and black pistol-grip foam gun, with the clear soap cup attached underneath and the white SEESE logo visible on the black collar. The gun sprays thick white foam across the side and windshield of a dark car, with soap foam running down the panels and water on the driveway. Show the garden hose connected to the rear/bottom of the handle, natural outdoor daylight, suburban driveway setting, practical realism. No pressure washer machine, no giant text, no floating icons, no split-screen comparison."
