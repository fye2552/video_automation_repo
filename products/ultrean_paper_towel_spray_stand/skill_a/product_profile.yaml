sku_id: "ultrean_paper_towel_spray_stand"
product_name: "Ultrean Paper Towel Stand with Spray Bottle"
category: "kitchen accessory / paper towel holder"
source_info:
  title: "Ultrean Paper Towel Stand with Weighted Base, No-Lift One-Hand Tear – Stainless Steel Countertop Holder with Tension Arm"
  description: "A matte black stainless steel paper towel dispenser featuring a 2.65lb weighted base, a spring-loaded tension arm for one-handed tearing, and a hidden, removable 4oz spray bottle integrated inside a solid black center rod."
visual_identity:
  main_color: "matte black (for the entire assembled exterior)"
  secondary_color: "transparent clear (only visible when the internal spray bottle is removed)"
  material: "stainless steel exterior, internal clear plastic/glass reservoir"
  shape: "circular base with a vertical solid cylindrical main rod and an angled side tension arm"
  texture: "smooth matte metal finish exterior"
  logo_position: "subtle 'ULTREAN' logo vertically on the tension arm"
  size_ratio: "Base is 8.03 inches wide, vertical rod is 12.5 inches tall"
key_visual_features:
  - "thick circular weighted base"
  - "completely opaque solid matte black vertical outer sleeve"
  - "top push-button mechanism (One-Push Lock)"
  - "removable inner spray bottle with a transparent 4oz liquid reservoir (hidden when assembled)"
  - "angled, spring-loaded tension arm attached to the base"
selling_points:
  - "Built-in 2.65lb weighted base prevents tipping and slipping"
  - "Spring-loaded tension arm allows for true one-handed tearing"
  - "Hidden 4oz spray bottle inside the center rod with a fine mist pump"
  - "One-push lock design for easy carrying and quick unlocking"
  - "Fits all standard to jumbo paper towel rolls"
usage_scenes:
  - "Placed on a modern kitchen countertop holding a jumbo paper towel roll"
  - "Hand pulling the spray bottle out of the black center sleeve to spray cleaner"
  - "Hand tearing a paper towel sheet using the tension arm"
must_keep:
  - "保持组装状态下产品外观全黑 (纯黑底座、纯黑主杆、纯黑张力臂)"
  - "保持产品形状不变 (圆形底座，垂直主杆，倾斜张力臂)"
  - "保留主杆顶部的按压锁扣 (One-Push Lock)"
  - "保留隐藏式喷壶设计 (仅在分离特写时展示透明水仓)"
must_avoid:
  - "不要改变产品品类"
  - "【核心禁忌】不要在组装完成的主杆上露出透明水仓，主杆外观必须是一根实心纯黑金属管"
  - "不要虚构不存在的功能 (如电动感应、底座发光)"
  - "不要增加多余按钮、电线或屏幕"
