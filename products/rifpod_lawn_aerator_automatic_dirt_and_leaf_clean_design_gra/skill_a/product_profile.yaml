image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for a RIFPOD manual lawn aerator. Show the full upright tool: black T-shaped top handle with soft grips, straight black vertical shaft with a small white RIFPOD logo, U-shaped black lower frame, rectangular black metal foot plate, 15 vertical silver iron spike rods, visible silver bolts and nuts, and bright green coil springs around the spike rods. The tool should stand slightly angled so the spike plate and spring-cleaning mechanism are clearly visible. Studio lighting, realistic powder-coated metal, polished rods, crisp shadows. No grass background, no dimension text, no callout arrows, no wheels, no motor."
  product_detail_collage: "Create a premium product-detail catalog image for the RIFPOD manual spike lawn aerator. Center the full black T-handle tool on a light gray studio background, then add four clean close-up detail panels showing: the white RIFPOD logo on the black shaft, the bright green dual-layer coil springs around silver spike rods, the black rectangular foot plate with bolts and nuts, and the adjustable handle joint with screws and washers. Keep spacing tidy and realistic, with minimal readable branding only. Avoid large headlines, comparison labels, medical icons, dimension overlays, and soil diagrams."
  realistic_usage_scene: "Create a realistic garden lawn aeration scene featuring the RIFPOD manual lawn aerator. A person stands upright on a green suburban lawn holding the black T-handle and pressing the rectangular spike plate into the grass. Show the black U-shaped lower frame, silver spike rods, green coil springs, and RIFPOD shaft logo visible. A small amount of soil and dry leaves should release cleanly from the spike area as the tool is lifted, suggesting the automatic dirt-and-leaf cleaning design. Natural outdoor daylight, practical garden realism, correct scale. No poster text, no floating icons, no rolling drum, no shoe aerator."
