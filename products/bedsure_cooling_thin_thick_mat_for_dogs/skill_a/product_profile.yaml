source_info:
  title: "Bedsure Cooling Thin & Thick Mat for Dogs - Q-MAX > 0.4 Washable Pet Cooling Pad, No Gel, No Electric, Non-Slip Summer Crate Bed for Large Dogs"
  description: "A light blue washable pet cooling mat for dogs. It uses cool-to-the-touch fabric rated Q-Max > 0.4, breathable airflow fabric, distributed PP cotton filling, quilted stitching, a fur-resistant surface, and a non-slip bottom. It is lightweight and flexible for crates, dog beds, tile floors, hardwood floors, cars, outdoor use, travel, camping, and home lounging. It is machine washable and dryer safe."
