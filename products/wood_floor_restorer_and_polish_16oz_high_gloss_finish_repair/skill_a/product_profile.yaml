image_prompts:
  white_background_packshot: "Create a clean e-commerce packshot on a pure white background for DAXAXA Wood Floor Restorer & Polish 16oz. Show one tall glossy red plastic bottle with rounded shoulders, a narrow neck, and a ribbed blue screw cap. The front label should be mostly deep blue with a yellow upper panel and cyan diagonal accent, a small red DAXAXA brand badge, large bold HARDWOOD POLISH lettering, and small benefit icons suggesting high-gloss shine and floor protection. Add a subtle 16 oz capacity cue on the label. Studio lighting, crisp bottle edges, realistic glossy plastic and printed label texture, soft shadow. No trigger sprayer, no large headline text, no furniture scene, no extra brands."
  product_detail_collage: "Create a premium product-detail catalog image for DAXAXA wood floor polish. Center the red bottle with blue cap on a light gray studio background, then add four clean close-up detail panels showing: the ribbed blue screw cap and bottle neck, the blue/yellow/cyan Hardwood Polish label, a glossy polished wood plank reflection, and a soft cloth smoothing polish over fine scratches on a wood surface. Keep the layout tidy, modern, and product-focused with realistic materials and minimal readable text. Avoid poster headlines, diagram arrows, large before-after labels, and cluttered furniture callouts."
  realistic_usage_scene: "Create a realistic home floor-care scene featuring DAXAXA Wood Floor Restorer & Polish. Place the recognizable red 16 oz bottle with blue cap and blue/yellow Hardwood Polish label on a warm hardwood floor while a flat mop spreads a thin glossy layer of polish evenly along the wood grain. Show subtle fine scratches becoming less visible and a clean high-gloss reflection on the treated area. Bright natural indoor light, upscale home hallway or living room, practical realism. No giant text, no floating icons, no trigger spray bottle, no exaggerated mirror effect."
