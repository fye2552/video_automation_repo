source_info:
  title: "Stainless Steel Chopping Board"
  description: |
    Stainless steel chopping board for kitchen food preparation. The product is a silver stainless steel cutting board with a smooth hygienic surface, suitable for slicing vegetables, fruits, and meats. Source materials show multiple size options such as approximately 40 x 30 cm, 50 x 40 cm, and 60 x 40 cm. The board is durable, easy to clean, and intended for home kitchen and restaurant food preparation use. The corrected product structure is not a completely flat sheet: one long edge is bent downward into a visible vertical folded lip of about 1 cm.

