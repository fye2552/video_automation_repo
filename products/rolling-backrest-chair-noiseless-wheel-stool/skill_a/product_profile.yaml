source_info:
  title: "1 Count Rolling Backarest Chair, Noiseless Wheel Stool with Skin-Friendly Fabric Cover"
  description: "【Multi functional roller stool】 A soft garage stool that can be used for car repairs, knee exercises, push ups, home office floor cleaning, home office workers, and more. 【Easy to store and save space】 The compact design makes it very easy to store under the bed and in cabinets. Not taking up too much space. Easy to disassemble, the roller can also be disassembled when not in use. 【360-degree rotation】Equipped with four high-quality swivel casters to ensure enhanced durability and stability. The wheels have a smooth 360 degree rotation function, combining flexible maneuverability with silent design. 【Comfortable cushion】This roller stool provides a comfortable seating area and is filled with resilient sponge for optimal comfort. The surface is decorated with soft which is both skin friendly and durable. With and odorless characteristics, the seat requires minimal maintenance and is easy to clean. 【Sturdy support structure】Durable and sturdy bracket: The roller stool bracket is made of high-quality metal processed by high-density extrusion. Thicker design. Even when used in a humid environment, it is not easy to rust."
